<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Danse">
<meta name="theme-color" content="#DDEEE8">
<title>Application danse — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --t900:#0E6973; --t500:#118C8C; --mid:#BAD9CE; --pale:#EAF4F0;
  --acc1:#F2BB16; --acc2:#BF820F;
  --sh:14,105,115; --tsh:17,140,140; --accsh:191,130,15;
  --ink:var(--t900); --soft:rgba(var(--sh),.60);
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#DDEEE8 0%,#F3F6F0 45%,#FCF3DD 100%);
  background-attachment:fixed;
  min-height:100vh; padding-bottom:132px; -webkit-font-smoothing:antialiased;
}
body.onb{padding-bottom:32px;}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0;}
h1,h2,h3,p{margin:0;}
.shell{max-width:412px;margin:0 auto;padding:22px 20px 0;}

.hello{font-size:21px;font-weight:600;letter-spacing:-.3px;}
.sub{font-size:13px;color:var(--soft);margin-top:2px;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px;}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,var(--t500),var(--t900));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;flex:none;}

.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(var(--sh),.09);}
.card + .card{margin-top:14px;}
.card-title{font-size:15px;font-weight:600;}
.tiny{font-size:11px;color:var(--soft);}
.row{display:flex;align-items:center;gap:12px;}

.today{display:flex;gap:18px;align-items:center;}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.legend-val{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;}

.ring{position:relative;display:grid;place-items:center;flex:none;}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.rings{position:relative;width:122px;height:122px;flex:none;}
.rings > *{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}

.bars{display:flex;align-items:flex-end;gap:9px;height:78px;margin-top:14px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;}
.bar{width:100%;border-radius:8px;background:rgba(var(--tsh),.18);}
.bar.on{background:linear-gradient(180deg,var(--acc1),var(--acc2));}
.day{font-size:10.5px;color:var(--soft);}
.day.on{color:var(--acc2);font-weight:600;}

.poles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.poles button{background:#fff;border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;
  align-items:center;gap:8px;font-size:11.5px;font-weight:500;line-height:1.25;text-align:center;
  box-shadow:0 6px 18px rgba(var(--sh),.07);}
.poles i{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;}

.section{font-size:15px;font-weight:600;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.link{font-size:12px;color:var(--t500);font-weight:500;}

.item{display:flex;align-items:center;gap:13px;background:#fff;border-radius:20px;padding:12px;
  box-shadow:0 8px 22px rgba(var(--sh),.07);width:100%;margin-bottom:11px;text-align:left;}
.item-body{flex:1;min-width:0;}
.item-title{font-size:13.5px;font-weight:600;line-height:1.3;}
.item-meta{font-size:11.5px;color:var(--soft);margin-top:4px;}
.go{width:32px;height:32px;border-radius:50%;background:var(--t500);display:grid;place-items:center;flex:none;}
.thumb{border-radius:16px;display:grid;place-items:center;flex:none;}

.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 14px;
  box-shadow:0 6px 18px rgba(var(--sh),.07);}
.search input{border:0;outline:0;flex:1;font-family:inherit;font-size:13px;color:var(--ink);background:none;}
.search input::placeholder{color:rgba(var(--sh),.42);}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 0;}
.chips.sub{padding-top:9px;}
.polerow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px;}
.polerow .chip{width:100%;text-align:center;padding:11px 8px;}
.chip{flex:none;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:#fff;color:var(--t500);box-shadow:0 4px 12px rgba(var(--sh),.06);}
.chip.on{background:var(--t500);color:#fff;}
.chip.s{padding:6px 13px;font-size:11.5px;background:rgba(var(--tsh),.10);box-shadow:none;}
.chip.s.on{background:var(--t900);color:#fff;}
.chip.x{display:flex;align-items:center;padding:6px 10px;background:rgba(var(--sh),.12);color:var(--t900);}
.chips-wrap{margin-bottom:16px;}

.video{position:relative;border-radius:26px;overflow:hidden;height:212px;display:grid;place-items:center;}
.video-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--sh),0) 40%,rgba(var(--sh),.45) 100%);}
.play{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(var(--sh),.3);position:relative;}
.clock{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.92);border-radius:999px;padding:7px 13px 7px 11px;}
.clock b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.4px;}
.live{width:7px;height:7px;border-radius:50%;background:rgba(var(--accsh),.3);}
.live.on{background:var(--acc2);}

.track{height:5px;border-radius:99px;background:rgba(var(--sh),.12);overflow:hidden;margin-top:14px;}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc1),var(--acc2));}

.stats{display:flex;gap:10px;margin-top:16px;}
.stat{flex:1;background:#fff;border-radius:18px;padding:13px;box-shadow:0 8px 20px rgba(var(--sh),.07);}
.stat-val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;}

.step{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(var(--sh),.08);}
.step:last-child{border-bottom:0;}
.step-n{width:28px;height:28px;border-radius:10px;background:rgba(var(--tsh),.12);display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--t500);flex:none;}

.cta{width:100%;padding:16px;border-radius:20px;background:var(--t500);color:#fff;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;box-shadow:0 12px 26px rgba(var(--tsh),.32);}
.cta.pause{background:var(--acc2);box-shadow:0 12px 26px rgba(var(--accsh),.3);}
.cta.ghost{background:#fff;color:var(--t500);box-shadow:0 8px 20px rgba(var(--sh),.08);}
.cta.warn{background:#fff;color:#B03A3A;box-shadow:0 8px 20px rgba(var(--sh),.08);}
.cta[disabled]{opacity:.4;box-shadow:none;cursor:not-allowed;}

.note{font-size:11.5px;color:var(--soft);text-align:center;margin-top:10px;line-height:1.5;}
.alert{background:rgba(var(--accsh),.16);border-radius:14px;padding:10px 13px;font-size:12px;margin-top:12px;line-height:1.5;}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:500;
  background:rgba(var(--tsh),.12);color:var(--t500);}
.badge.gold{background:rgba(var(--accsh),.16);color:var(--acc2);}

/* --- onboarding --- */
.brand{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;}
.hero{height:208px;border-radius:28px;background:linear-gradient(140deg,#118C8C,#BAD9CE 55%,#F2BB16);
  display:grid;place-items:center;margin:8px 0 26px;box-shadow:0 18px 40px rgba(var(--sh),.18);}
.steps-dots{display:flex;gap:6px;margin-bottom:22px;}
.sdot{height:4px;flex:1;border-radius:99px;background:rgba(var(--sh),.14);}
.sdot.on{background:var(--t500);}
.field{background:#fff;border-radius:16px;padding:12px 15px;margin-bottom:11px;box-shadow:0 6px 18px rgba(var(--sh),.07);}
.field label{display:block;font-size:10.5px;color:var(--soft);margin-bottom:3px;}
.field input{border:0;outline:0;width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:none;}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:18px;padding:14px 15px;
  margin-bottom:10px;text-align:left;font-size:13.5px;font-weight:500;box-shadow:0 6px 18px rgba(var(--sh),.07);
  border:1.5px solid transparent;}
.opt.on{border-color:var(--t500);background:rgba(var(--tsh),.07);}
.opt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(var(--sh),.22);flex:none;
  display:grid;place-items:center;margin-left:auto;}
.opt.on .tick{border-color:var(--t500);background:var(--t500);}
.opt .oi{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;}

.plan{width:100%;text-align:left;background:#fff;border-radius:22px;padding:17px;margin-bottom:12px;
  box-shadow:0 10px 26px rgba(var(--sh),.09);border:1.8px solid transparent;position:relative;}
.plan.on{border-color:var(--t500);}
.plan-top{display:flex;align-items:baseline;gap:8px;}
.plan-name{font-size:15px;font-weight:600;}
.plan-price{margin-left:auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.plan-sub{font-size:11.5px;color:var(--soft);margin-top:5px;}
.ribbon{position:absolute;top:-9px;right:16px;background:var(--acc2);color:#fff;font-size:10px;font-weight:600;
  padding:3px 10px;border-radius:99px;}
.feat{display:flex;align-items:center;gap:9px;font-size:12.5px;margin-top:10px;}
.feat i{width:18px;height:18px;border-radius:50%;background:rgba(var(--tsh),.14);display:grid;place-items:center;flex:none;}

/* --- interrupteur --- */
.sw{width:44px;height:26px;border-radius:99px;background:rgba(var(--sh),.16);position:relative;flex:none;transition:background .2s;}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(var(--sh),.25);transition:transform .2s;}
.sw.on{background:var(--t500);}
.sw.on::after{transform:translateX(18px);}
.swrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;
  border-bottom:1px solid rgba(var(--sh),.08);}
.swrow:last-child{border-bottom:0;}
.swrow .lbl{flex:1;font-size:13px;font-weight:500;}

/* --- segmenté --- */
.seg{display:flex;background:rgba(var(--sh),.08);border-radius:16px;padding:4px;margin-bottom:16px;}
.seg button{flex:1;padding:9px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--soft);}
.seg button.on{background:#fff;color:var(--t900);box-shadow:0 4px 12px rgba(var(--sh),.1);}

/* --- classement --- */
.rank{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:11px 13px;
  margin-bottom:9px;width:100%;text-align:left;box-shadow:0 6px 16px rgba(var(--sh),.06);}
.rank.me{background:rgba(var(--tsh),.10);box-shadow:none;border:1.5px solid var(--t500);}
.pos{width:26px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;flex:none;}
.mini-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12.5px;
  font-weight:600;flex:none;}
.rank-n{font-size:13px;font-weight:600;}
.rank-m{font-size:11px;color:var(--soft);margin-top:2px;}
.rank-v{margin-left:auto;text-align:right;}
.rank-v b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}

.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:40;
  display:flex;align-items:center;gap:11px;background:#fff;border-radius:999px;padding:8px 8px 8px 16px;
  box-shadow:0 14px 30px rgba(var(--sh),.22);max-width:372px;}
.mini-t{font-size:12.5px;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-c{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--acc2);}
.mini button{width:34px;height:34px;border-radius:50%;background:var(--t500);display:grid;place-items:center;}

.nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:6px;padding:9px;border-radius:30px;background:var(--acc2);
  box-shadow:0 16px 34px rgba(var(--accsh),.38),inset 0 1px 0 rgba(255,255,255,.22);}
.nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;
  position:relative;transition:background .25s ease;}
.nav button.on{background:#fff;color:var(--acc2);}
.nav button svg{transform-origin:50% 50%;}
.nav button.heart{animation:heartbeat 1.5s ease-in-out infinite;transform-origin:50% 50%;}
@keyframes heartbeat{
  0%{transform:scale(1)}
  9%{transform:scale(1.18)}
  17%{transform:scale(1.01)}
  26%{transform:scale(1.12)}
  38%{transform:scale(1)}
  100%{transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){ .nav button.heart{animation:none} }
.back{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(var(--sh),.1);}
.demo{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(14,105,115,.92);color:#fff;
  font-size:10.5px;text-align:center;padding:5px;letter-spacing:.3px;}
body.demo-on{padding-top:22px;}
</style>
</head>
<body>

<div class="demo" id="demo">Maquette de démonstration — aucun paiement réel</div>
<div class="shell" id="screen"></div>
<div id="mini"></div>
<nav class="nav" id="nav"></nav>

<script>
var C = {t900:'#0E6973', t500:'#118C8C', mid:'#BAD9CE', acc1:'#F2BB16', acc2:'#BF820F', sh:'14,105,115'};

/* ---------- icônes ---------- */
var PATHS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1"/>',
  music:'<circle cx="7" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M10 18V5l11-2v13"/>',
  chart:'<line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-3.7 3.4-5.8 7.5-5.8s7.5 2.1 7.5 5.8"/>',
  chevron:'<polyline points="9.5 5.5 16 12 9.5 18.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/>',
  arrow:'<line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/>',
  timer:'<circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="12" y2="9"/><line x1="9" y1="2" x2="15" y2="2"/>',
  flame:'<path d="M12 2.5c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3.2 2-4.5.4 1.3 1.2 2 2.2 2.2C9.8 7.5 10.8 4.8 12 2.5z"/>',
  bell:'<path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/>',
  check:'<polyline points="4 12.5 9.5 18 20 6.5"/>',
  close:'<line x1="5.5" y1="5.5" x2="18.5" y2="18.5"/><line x1="18.5" y1="5.5" x2="5.5" y2="18.5"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><line x1="2.5" y1="10" x2="21.5" y2="10"/>',
  trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><line x1="12" y1="14" x2="12" y2="18"/><path d="M8.5 21h7"/>',
  lock:'<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  spark:'<path d="M12 3l2.1 5.4L19.5 10l-5.4 1.6L12 17l-2.1-5.4L4.5 10l5.4-1.6z"/>',
  logout:'<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><polyline points="9 8 5 12 9 16"/><line x1="5" y1="12" x2="15" y2="12"/>'
};
function ic(n, s, c, fill){
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+(fill?c:'none')+'" stroke="'+c+
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+PATHS[n]+'</svg>';
}
function play(s,c){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+c+'"><polygon points="7,4.5 19,12 7,19.5"/></svg>';}
function pause(s,c){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+c+'"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.4"/></svg>';}

/* ---------- catalogue ---------- */
var POLES = [
  {key:'cours', label:'Cours entiers', icon:'activity', subs:['Dancemooov débutant','Dancemooov intermédiaire']},
  {key:'capsule', label:'Capsules techniques', icon:'target', subs:['Zooom souplesse','Zooom équilibre','Zooom step dancehall','Zooom bounce']},
  {key:'choreo', label:'Chorégraphies', icon:'music', subs:['House','Afro','Dancehall','Street jazz']}
];
var THUMB = {
  'Dancemooov débutant':'linear-gradient(140deg,#118C8C,#BAD9CE)',
  'Dancemooov intermédiaire':'linear-gradient(140deg,#0E6973,#118C8C)',
  'Zooom souplesse':'linear-gradient(140deg,#BAD9CE,#118C8C)',
  'Zooom équilibre':'linear-gradient(140deg,#7FB8B8,#0E6973)',
  'Zooom step dancehall':'linear-gradient(140deg,#118C8C,#7FB8B8)',
  'Zooom bounce':'linear-gradient(140deg,#0E6973,#BAD9CE)',
  'House':'linear-gradient(140deg,#F2BB16,#BF820F)',
  'Afro':'linear-gradient(140deg,#BF820F,#0E6973)',
  'Dancehall':'linear-gradient(140deg,#F2BB16,#118C8C)',
  'Street jazz':'linear-gradient(140deg,#BF820F,#118C8C)'
};
var ALL_SUBS = [];
POLES.forEach(function(p){ p.subs.forEach(function(s){ ALL_SUBS.push(s); }); });

function poleOf(key){ for(var i=0;i<POLES.length;i++){ if(POLES[i].key===key) return POLES[i]; } return POLES[0]; }
function poleOfSub(sub){ for(var i=0;i<POLES.length;i++){ if(POLES[i].subs.indexOf(sub)>-1) return POLES[i]; } return POLES[0]; }

var SESSIONS = [
 {id:'c1', sub:'Dancemooov débutant', title:'Dancemooov débutant nº1', min:45, kcal:330, level:'Débutant',
  blurb:'Le cours complet : échauffement, traversées, technique, puis une chorégraphie courte montée pas à pas.',
  steps:[['Échauffement','8 min'],['Traversées','7 min'],['Technique du jour','10 min'],['Apprentissage','14 min'],['Filage','4 min'],['Retour au calme','2 min']]},
 {id:'c2', sub:'Dancemooov débutant', title:'Dancemooov débutant nº2', min:45, kcal:340, level:'Débutant',
  blurb:'Même structure, nouvelle chorégraphie. À enchaîner après le nº1 ou à prendre seul.',
  steps:[['Échauffement','8 min'],['Traversées','7 min'],['Technique du jour','10 min'],['Apprentissage','14 min'],['Filage','4 min'],['Retour au calme','2 min']]},

/* ---------- utilitaires ---------- */
function cur(){ return byId(S.id) || SESSIONS[0]; }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(sec){
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
}
function todayMin(){ return Math.floor(S.todaySec/60); }
function week(){ var w=WEEK_BASE.slice(); w[TODAY]=todayMin(); return w; }
function weekTotal(){ var w=week(), t=0; for(var i=0;i<7;i++) t+=w[i]; return t; }
function kcal(){ return Math.round(S.todaySec/60*7.4); }
function firstName(){ return S.profile.first || 'Robin'; }
function initial(){ return firstName().charAt(0).toUpperCase(); }

function ring(size,stroke,pct,color,inner){
  var r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.min(pct,1));
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba('+C.sh+',.12)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+
      '" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+
      '" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+
    '<div class="ring-label">'+(inner||'')+'</div></div>';
}
function thumb(sub,size){
  return '<div class="thumb" style="width:'+size+'px;height:'+size+'px;background:'+THUMB[sub]+'">'+
    ic(poleOfSub(sub).icon, Math.round(size*0.34), '#fff')+'</div>';
}
function bars(){
  var w=week(), h='<div class="bars">';
  for(var i=0;i<7;i++){
    var pc=Math.max(6, Math.min(100, w[i]/60*100));
    h+='<div class="bar-col"><div class="bar'+(i===TODAY?' on':'')+'" style="height:'+pc+'%"></div>'+
       '<div class="day'+(i===TODAY?' on':'')+'">'+DAYS[i]+'</div></div>';
  }
  return h+'</div>';
}

/* ---------- progrès + classement ---------- */
function boardRows(course){
  var seed = hash(course);
  var list = MEMBERS.map(function(m,i){
    return {n:m.n, min:Math.max(20, m.min - ((seed+i*13)%90)), s:m.s, st:m.st, since:m.since, i:i};
  });
  list.push({n:firstName()+' (toi)', min:weekTotal(), s:S.done+4, st:5, since:'septembre 2026', me:true, i:8});
  list.sort(function(a,b){ return b.min-a.min; });
  return list;
}

/* ---------- rendu ---------- */
var screenEl = document.getElementById('screen');
var miniEl = document.getElementById('mini');
var navEl = document.getElementById('nav');

function render(){
  var focused = document.activeElement && document.activeElement.id;
  var pos = 0;
  if(focused && document.activeElement.selectionStart!==undefined){
    try{ pos = document.activeElement.selectionStart; }catch(e){}
  }

  var onb = S.phase!=='app';
  document.body.classList.toggle('onb', onb);
  navEl.style.display = onb ? 'none' : 'flex';

  var v;
  if(S.phase==='welcome') v = viewWelcome();
  else if(S.phase==='signup') v = viewSignup();
  else if(S.phase==='quiz') v = viewQuiz();
  else if(S.phase==='plans') v = viewPlans();
  else if(S.phase==='pay') v = viewPay();
  else if(S.tab==='home') v = viewHome();
  else if(S.tab==='library') v = viewLibrary();
  else if(S.tab==='player') v = viewPlayer();
  else if(S.tab==='stats') v = S.member ? viewMember() : viewStats();
  else if(S.tab==='manage') v = viewManage();
  else if(S.tab==='cancel') v = viewCancel();
  else v = viewProfile();
  screenEl.innerHTML = v;

  if(focused){
    var el = document.getElementById(focused);
    if(el && el.tagName==='INPUT'){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
  }

  miniEl.innerHTML = (!onb && S.running && S.tab!=='player')
    ? '<div class="mini">'+ic('timer',16,C.acc2)+'<div class="mini-t">'+cur().title+'</div>'+
      '<div class="mini-c">'+fmt(S.elapsed)+'</div>'+
      '<button data-act="tab" data-tab="player">'+ic('chevron',16,'#fff')+'</button></div>'
    : '';

  if(!onb) syncNav();
}

var TABS = [['home','home'],['library','activity'],['stats','chart'],['profile','user']];
function buildNav(){
  navEl.innerHTML = TABS.map(function(t){
    return '<button data-act="tab" data-tab="'+t[0]+'" aria-label="'+t[0]+'">'+ic(t[1],21,'currentColor')+'</button>';
  }).join('');
}
function syncNav(){
  var btns = navEl.children;
  for(var i=0;i<btns.length;i++){
    var key = TABS[i][0];
    var on = S.tab===key
      || (key==='library' && S.tab==='player')
      || (key==='profile' && (S.tab==='manage'||S.tab==='cancel'));
    btns[i].classList.toggle('on', on);
    btns[i].classList.toggle('heart', on);
    btns[i].setAttribute('aria-current', on ? 'page' : 'false');
  }
}

/* ---------- interactions ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el || el.hasAttribute('disabled')) return;
  var act = el.getAttribute('data-act');

  if(act==='phase'){
    var ph = el.getAttribute('data-phase');
    if(ph==='quiz') S.quizStep = 0;
    S.phase = ph;
    if(ph==='app') S.tab = 'home';
  }
  else if(act==='quiz'){
    var k = el.getAttribute('data-key'), val = el.getAttribute('data-val');
    if(el.getAttribute('data-multi')==='1'){
      var arr = S.profile[k] || [];
      var at = arr.indexOf(val);
      if(at>-1) arr.splice(at,1); else arr.push(val);
      S.profile[k] = arr;
    } else { S.profile[k] = val; }
  }
  else if(act==='quiznext'){
    if(S.quizStep < QUIZ.length-1) S.quizStep++;
    else S.phase = 'plans';
  }
  else if(act==='plan'){ S.plan = el.getAttribute('data-plan'); }
  else if(act==='tab'){ S.tab = el.getAttribute('data-tab'); S.member = null; }
  else if(act==='ptab'){ S.progressTab = el.getAttribute('data-ptab'); S.member = null; }
  else if(act==='board'){ S.board = el.getAttribute('data-board'); }
  else if(act==='member'){
    S.member = {n:el.getAttribute('data-member'), min:el.getAttribute('data-min'),
      s:el.getAttribute('data-s'), st:el.getAttribute('data-st'), since:el.getAttribute('data-since')};
  }
  else if(act==='follow'){
    var sb = el.getAttribute('data-sub');
    S.follows[sb] = !S.follows[sb];
  }
  else if(act==='notif'){ var nk = el.getAttribute('data-key'); S.notifs[nk] = !S.notifs[nk]; }
  else if(act==='public'){ S.profile.public = !S.profile.public; }
  else if(act==='cancelconfirm'){ S.subActive = false; S.tab = 'profile'; }
  else if(act==='reactivate'){ S.subActive = true; S.tab = 'profile'; }
  else if(act==='open'){
    var id = el.getAttribute('data-id');
    if(id !== S.id){ S.id = id; S.elapsed = 0; S.running = false; }
    S.tab = 'player';
  }
  else if(act==='pole'){
    S.pole = el.getAttribute('data-pole'); S.sub = null;
    if(!el.getAttribute('data-stay')) S.tab = 'library';
  }
  else if(act==='sub'){ var v2 = el.getAttribute('data-sub'); S.sub = v2===''?null:v2; }
  else if(act==='toggle'){ S.autoPaused = false; S.running = !S.running; }

  render();
});

document.addEventListener('input', function(e){
  var t = e.target;
  if(!t || t.tagName!=='INPUT') return;
  if(t.id==='q'){ S.q = t.value; render(); }
  else if(t.id==='f_first'){ S.profile.first = t.value; render(); }
  else if(t.id==='f_email'){ S.profile.email = t.value; render(); }
});

setInterval(function(){
  if(!S.running) return;
  S.elapsed++; S.todaySec++;
  var c = cur();
  if(S.elapsed >= c.min*60){ S.running = false; S.done++; }
  render();
}, 1000);

document.addEventListener('visibilitychange', function(){
  if(document.hidden && S.running){ S.running = false; S.autoPaused = true; render(); }
});

document.body.classList.add('demo-on');
buildNav();
render();
</script>
