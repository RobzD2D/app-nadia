<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Séances">
<meta name="theme-color" content="#DDEEE8">
<title>Séances — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --t900:#0E6973; --t500:#118C8C; --mid:#BAD9CE; --pale:#EAF4F0;
  --acc1:#F2BB16; --acc2:#BF820F;
  --sh:14,105,115; --tsh:17,140,140; --accsh:191,130,15;
  --bg1:#DDEEE8; --bg2:#F3F6F0; --bg3:#FCF3DD;
  --ink:var(--t900); --soft:rgba(var(--sh),.60);
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);
  background-attachment:fixed;
  min-height:100vh; padding-bottom:132px; -webkit-font-smoothing:antialiased;
  transition:background .4s ease, color .4s ease;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0;}
h1,h2,h3,p{margin:0;}
.shell{max-width:412px;margin:0 auto;padding:22px 20px 0;}

.hello{font-size:21px;font-weight:600;letter-spacing:-.3px;}
.sub{font-size:13px;color:var(--soft);margin-top:2px;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px;}
.head-right{display:flex;align-items:center;gap:9px;flex:none;}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,var(--t500),var(--t900));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;flex:none;}

.theme-btn{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;
  box-shadow:0 6px 16px rgba(var(--sh),.12);}
.theme-btn span{width:20px;height:20px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85);}

.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(var(--sh),.09);}
.card + .card{margin-top:14px;}
.card-title{font-size:15px;font-weight:600;}
.tiny{font-size:11px;color:var(--soft);}

.today{display:flex;gap:18px;align-items:center;}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.legend-val{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;}

.ring{position:relative;display:grid;place-items:center;flex:none;}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.rings{position:relative;width:122px;height:122px;flex:none;}
.rings > *{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}

.bars{display:flex;align-items:flex-end;gap:9px;height:78px;margin-top:14px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;}
.bar{width:100%;border-radius:8px;background:rgba(var(--tsh),.18);}
.bar.on{background:linear-gradient(180deg,var(--acc1),var(--acc2));}
.day{font-size:10.5px;color:var(--soft);}
.day.on{color:var(--acc2);font-weight:600;}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.quick button{background:#fff;border-radius:18px;padding:13px 14px;display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:500;box-shadow:0 6px 18px rgba(var(--sh),.07);text-align:left;}
.quick i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;}

.section{font-size:15px;font-weight:600;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.link{font-size:12px;color:var(--t500);font-weight:500;}

.item{display:flex;align-items:center;gap:13px;background:#fff;border-radius:20px;padding:12px;
  box-shadow:0 8px 22px rgba(var(--sh),.07);width:100%;margin-bottom:11px;text-align:left;}
.item-body{flex:1;min-width:0;}
.item-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:11.5px;color:var(--soft);margin-top:3px;}
.go{width:32px;height:32px;border-radius:50%;background:var(--t500);display:grid;place-items:center;flex:none;}
.thumb{border-radius:16px;display:grid;place-items:center;flex:none;}

.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 14px;
  box-shadow:0 6px 18px rgba(var(--sh),.07);}
.search input{border:0;outline:0;flex:1;font-family:inherit;font-size:13px;color:var(--ink);background:none;}
.search input::placeholder{color:rgba(var(--sh),.42);}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 16px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:#fff;color:var(--t500);box-shadow:0 4px 12px rgba(var(--sh),.06);}
.chip.on{background:var(--t500);color:#fff;}

.video{position:relative;border-radius:26px;overflow:hidden;height:212px;display:grid;place-items:center;}
.video-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--sh),0) 40%,rgba(var(--sh),.45) 100%);}
.play{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(var(--sh),.3);position:relative;}
.clock{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.92);border-radius:999px;padding:7px 13px 7px 11px;}
.clock b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.4px;}
.live{width:7px;height:7px;border-radius:50%;background:rgba(var(--accsh),.3);}
.live.on{background:var(--acc2);}

.track{height:5px;border-radius:99px;background:rgba(var(--sh),.12);overflow:hidden;margin-top:14px;}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc1),var(--acc2));}

.stats{display:flex;gap:10px;margin-top:16px;}
.stat{flex:1;background:#fff;border-radius:18px;padding:13px;box-shadow:0 8px 20px rgba(var(--sh),.07);}
.stat-val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;}

.step{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(var(--sh),.08);}
.step:last-child{border-bottom:0;}
.step-n{width:28px;height:28px;border-radius:10px;background:rgba(var(--tsh),.12);display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--t500);flex:none;}

.cta{width:100%;padding:16px;border-radius:20px;background:var(--t500);color:#fff;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;box-shadow:0 12px 26px rgba(var(--tsh),.32);}
.cta.pause{background:var(--acc2);box-shadow:0 12px 26px rgba(var(--accsh),.3);}

.note{font-size:11.5px;color:var(--soft);text-align:center;margin-top:10px;line-height:1.5;}
.alert{background:rgba(var(--accsh),.16);border-radius:14px;padding:10px 13px;font-size:12px;margin-top:12px;line-height:1.5;}

.theme-list{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.theme-opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;width:100%;
  font-size:13px;font-weight:500;background:rgba(var(--sh),.05);text-align:left;}
.theme-opt.on{background:rgba(var(--tsh),.14);}
.theme-opt .sw{width:34px;height:34px;border-radius:12px;flex:none;}
.theme-opt .st{flex:1;}
.theme-opt .ck{font-size:12px;color:var(--t500);font-weight:600;}

.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:40;
  display:flex;align-items:center;gap:11px;background:#fff;border-radius:999px;padding:8px 8px 8px 16px;
  box-shadow:0 14px 30px rgba(var(--sh),.22);max-width:372px;}
.mini-t{font-size:12.5px;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-c{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--acc2);}
.mini button{width:34px;height:34px;border-radius:50%;background:var(--t500);display:grid;place-items:center;}

.nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:6px;padding:9px;border-radius:30px;background:var(--acc2);
  box-shadow:0 16px 34px rgba(var(--accsh),.38),inset 0 1px 0 rgba(255,255,255,.22);
  transition:background .4s ease;}
.nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:background .25s;}
.nav button.on{background:#fff;}
.back{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(var(--sh),.1);}
</style>
</head>
<body>

<div class="shell" id="screen"></div>
<div id="mini"></div>
<nav class="nav" id="nav"></nav>

<script>
/* ---------- thèmes ---------- */
var THEMES = {
  lagon:{
    name:'Lagon',
    t900:'#0E6973', t500:'#118C8C', mid:'#BAD9CE', pale:'#EAF4F0',
    acc1:'#F2BB16', acc2:'#BF820F',
    sh:'14,105,115', tsh:'17,140,140', accsh:'191,130,15',
    bg1:'#DDEEE8', bg2:'#F3F6F0', bg3:'#FCF3DD',
    thumb:{
      'Étirements':'linear-gradient(140deg,#118C8C,#BAD9CE)',
      'Fitness':'linear-gradient(140deg,#0E6973,#118C8C)',
      'Danse':'linear-gradient(140deg,#F2BB16,#BF820F)',
      'Mobilité':'linear-gradient(140deg,#BAD9CE,#118C8C)',
      'Respiration':'linear-gradient(140deg,#0E6973,#7FB8B8)'
    }
  },
  violette:{
    name:'Violette',
    t900:'#3B174D', t500:'#633A78', mid:'#9B709F', pale:'#F4EAF2',
    acc1:'#D3B87E', acc2:'#B9955B',
    sh:'59,23,77', tsh:'99,58,120', accsh:'185,149,91',
    bg1:'#EFE2ED', bg2:'#F8F2F6', bg3:'#F4EADA',
    thumb:{
      'Étirements':'linear-gradient(140deg,#633A78,#9B709F)',
      'Fitness':'linear-gradient(140deg,#3B174D,#633A78)',
      'Danse':'linear-gradient(140deg,#9B709F,#B9955B)',
      'Mobilité':'linear-gradient(140deg,#9B709F,#633A78)',
      'Respiration':'linear-gradient(140deg,#3B174D,#9B709F)'
    }
  }
};
var THEME_KEYS = ['lagon','violette'];
var T = THEMES.lagon;

function applyTheme(key){
  T = THEMES[key];
  var r = document.documentElement.style;
  ['t900','t500','mid','pale','acc1','acc2','sh','tsh','accsh','bg1','bg2','bg3'].forEach(function(k){
    r.setProperty('--'+k, T[k]);
  });
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', T.bg1);
  S.theme = key;
}
function otherTheme(){ return S.theme === 'lagon' ? 'violette' : 'lagon'; }

/* ---------- icônes ---------- */
var PATHS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  chart:'<line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-3.7 3.4-5.8 7.5-5.8s7.5 2.1 7.5 5.8"/>',
  chevron:'<polyline points="9.5 5.5 16 12 9.5 18.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/>',
  arrow:'<line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/>',
  timer:'<circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="12" y2="9"/><line x1="9" y1="2" x2="15" y2="2"/>',
  flame:'<path d="M12 2.5c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3.2 2-4.5.4 1.3 1.2 2 2.2 2.2C9.8 7.5 10.8 4.8 12 2.5z"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 16h8a3 3 0 1 1-3 3"/><path d="M3 12h15a3 3 0 1 0-3-3"/>',
  music:'<circle cx="7" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M10 18V5l11-2v13"/>',
  zap:'<polygon points="13 2 4 14 11 14 10 22 20 10 13 10 13 2"/>'
};
function ic(n, s, c, fill){
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+(fill?c:'none')+'" stroke="'+c+
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+PATHS[n]+'</svg>';
}
function play(s,c){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+c+'"><polygon points="7,4.5 19,12 7,19.5"/></svg>';}
function pause(s,c){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+c+'"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.4"/></svg>';}

/* ---------- données ---------- */
var CAT_ICON = {'Étirements':'activity','Fitness':'zap','Danse':'music','Mobilité':'activity','Respiration':'wind'};
var CATS = ['Tous','Étirements','Fitness','Danse','Mobilité','Respiration'];

var SESSIONS = [
 {id:'s1',title:'Réveil articulaire',cat:'Étirements',min:12,kcal:65,level:'Doux',
  blurb:'Une mise en mouvement complète, du cou aux chevilles, à faire au saut du lit.',
  steps:[['Respiration debout','2 × 30 s'],['Cercles d’épaules','3 × 20 s'],['Chat / vache','3 × 45 s'],['Ouverture de hanche','2 × 60 s'],['Étirement mollets','2 × 40 s']]},
 {id:'s2',title:'Ouverture des hanches',cat:'Étirements',min:22,kcal:90,level:'Intermédiaire',
  blurb:'Le format long pour relâcher psoas et fessiers après une journée assise.',
  steps:[['Fente basse tenue','2 × 90 s'],['Pigeon','2 × 90 s'],['Papillon','3 × 60 s'],['Torsion allongée','2 × 60 s']]},
 {id:'s3',title:'Cardio danse afro',cat:'Danse',min:30,kcal:310,level:'Tonique',
  blurb:'Trente minutes sans pause, sur quatre rythmes. Tu transpires, tu apprends la choré.',
  steps:[['Échauffement guidé','5 min'],['Pas de base','6 min'],['Enchaînement 1','8 min'],['Enchaînement 2','8 min'],['Retour au calme','3 min']]},
 {id:'s4',title:'Renfo full body',cat:'Fitness',min:28,kcal:240,level:'Intermédiaire',
  blurb:'Quatre blocs, zéro matériel. Le poids du corps suffit.',
  steps:[['Squats','4 × 12 reps'],['Pompes','4 × 10 reps'],['Fentes marchées','3 × 16 reps'],['Gainage','3 × 45 s']]},
 {id:'s5',title:'Dos et nuque au bureau',cat:'Mobilité',min:9,kcal:35,level:'Doux',
  blurb:'À faire sur ta chaise, entre deux réunions. Aucun tapis nécessaire.',
  steps:[['Nuque latérale','2 × 30 s'],['Ouverture pectoraux','2 × 40 s'],['Torsion assise','2 × 45 s'],['Poignets','2 × 30 s']]},
 {id:'s6',title:'Choré hip-hop nº4',cat:'Danse',min:18,kcal:170,level:'Tonique',
  blurb:'On décompose les huit temps au ralenti, puis on monte la vitesse.',
  steps:[['Décomposition 1-4','6 min'],['Décomposition 5-8','6 min'],['Choré complète','4 min'],['Filage musique','2 min']]},
 {id:'s7',title:'Gainage express',cat:'Fitness',min:15,kcal:130,level:'Tonique',
  blurb:'Cinq exercices, trois tours, une minute de récup entre chaque tour.',
  steps:[['Planche','3 × 45 s'],['Planche latérale','3 × 30 s'],['Hollow hold','3 × 30 s'],['Mountain climbers','3 × 40 s']]},
 {id:'s8',title:'Respiration du soir',cat:'Respiration',min:10,kcal:20,level:'Doux',
  blurb:'Cohérence cardiaque guidée pour faire redescendre le rythme avant de dormir.',
  steps:[['Installation','2 min'],['Cycle 5-5','4 min'],['Cycle 4-6','3 min'],['Silence','1 min']]}
];

var DAYS = ['L','M','M','J','V','S','D'];
var WEEK_BASE = [32,0,45,28,12,50,0];
var TODAY = 6, GOAL = 45;

var S = {tab:'home', id:'s1', running:false, elapsed:0, todaySec:18*60, done:1, q:'', cat:'Tous', autoPaused:false, theme:'lagon'};

/* ---------- utilitaires ---------- */
function cur(){ for(var i=0;i<SESSIONS.length;i++){ if(SESSIONS[i].id===S.id) return SESSIONS[i]; } return SESSIONS[0]; }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(sec){
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
}
function todayMin(){ return Math.floor(S.todaySec/60); }
function week(){ var w=WEEK_BASE.slice(); w[TODAY]=todayMin(); return w; }
function kcal(){ return Math.round(S.todaySec/60*7.4); }

function ring(size,stroke,pct,color,inner){
  var r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.min(pct,1));
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba('+T.sh+',.12)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+
      '" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+
      '" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+
    '<div class="ring-label">'+(inner||'')+'</div></div>';
}
function thumb(cat,size){
  return '<div class="thumb" style="width:'+size+'px;height:'+size+'px;background:'+T.thumb[cat]+'">'+
    ic(CAT_ICON[cat], Math.round(size*0.34), '#fff')+'</div>';
}
function bars(){
  var w=week(), h='<div class="bars">';
  for(var i=0;i<7;i++){
    var pc=Math.max(6, Math.min(100, w[i]/60*100));
    h+='<div class="bar-col"><div class="bar'+(i===TODAY?' on':'')+'" style="height:'+pc+'%"></div>'+
       '<div class="day'+(i===TODAY?' on':'')+'">'+DAYS[i]+'</div></div>';
  }
  return h+'</div>';
}
function themeBtn(){
  var o = THEMES[otherTheme()];
  return '<button class="theme-btn" data-act="theme" data-theme="'+otherTheme()+'" title="Passer au thème '+o.name+'" aria-label="Changer de thème">'+
    '<span style="background:linear-gradient(135deg,'+o.t500+' 0%,'+o.t900+' 50%,'+o.acc2+' 100%)"></span></button>';
}
function head(title,sub){
  return '<div class="head"><div><h1 class="hello">'+title+'</h1><p class="sub">'+sub+'</p></div>'+
    '<div class="head-right">'+themeBtn()+'<div class="avatar">R</div></div></div>';
}
function itemRow(s, meta, extra){
  return '<button class="item" data-act="open" data-id="'+s.id+'">'+thumb(s.cat,64)+
    '<div class="item-body"><div class="item-title">'+s.title+'</div>'+
    '<div class="item-meta">'+meta+'</div>'+(extra||'')+'</div>'+
    '<div class="go">'+ic('chevron',16,'#fff')+'</div></button>';
}

/* ---------- écrans ---------- */
function viewHome(){
  var c=cur(), w=week(), tm=todayMin();
  var h = head('Bonjour Robin', tm>=GOAL ? 'Objectif du jour atteint. Belle séance.' : 'Encore '+(GOAL-tm)+' min pour boucler ta journée');

  h += '<div class="card"><div class="card-title" style="margin-bottom:16px">Aujourd’hui</div><div class="today">'+
    ring(104,11,tm/GOAL,T.t500,
      '<div style="font-size:21px;font-weight:700;font-variant-numeric:tabular-nums">'+Math.round(tm/GOAL*100)+'%</div>'+
      '<div style="font-size:10px;color:rgba('+T.sh+',.6)">de l’objectif</div>')+
    '<div class="legend">'+
      '<div class="legend-row"><span class="dot" style="background:'+T.t500+'"></span>Temps actif<span class="legend-val">'+fmt(S.todaySec)+'</span></div>'+
      '<div class="legend-row"><span class="dot" style="background:'+T.acc1+'"></span>Séances<span class="legend-val">'+S.done+'</span></div>'+
      '<div class="legend-row"><span class="dot" style="background:'+T.acc2+'"></span>Calories<span class="legend-val">'+kcal()+' kcal</span></div>'+
    '</div></div></div>';

  var total=0; for(var i=0;i<7;i++) total+=w[i];
  h += '<div class="card"><div class="card-title">Ta semaine</div><p class="tiny" style="margin-top:3px">'+total+' minutes sur 7 jours</p>'+bars()+'</div>';

  h += '<div class="quick">';
  ['Étirements','Fitness','Danse','Respiration'].forEach(function(c2){
    h += '<button data-act="cat" data-cat="'+c2+'"><i style="background:'+T.thumb[c2]+'">'+ic(CAT_ICON[c2],15,'#fff')+'</i>'+c2+'</button>';
  });
  h += '</div>';

  var pct = Math.min(100, S.elapsed/(c.min*60)*100);
  h += '<div class="section">Reprendre<button class="link" data-act="tab" data-tab="library">Tout voir</button></div>'+
    '<button class="item" data-act="open" data-id="'+c.id+'">'+thumb(c.cat,64)+
    '<div class="item-body"><div class="item-title">'+c.title+'</div>'+
    '<div class="item-meta">'+(S.elapsed>0 ? fmt(S.elapsed)+' sur '+c.min+' min' : c.min+' min · '+c.cat)+'</div>'+
    '<div class="track" style="margin-top:9px"><div class="fill" style="width:'+pct+'%"></div></div></div>'+
    '<div class="go">'+play(14,'#fff')+'</div></button>';

  h += '<div class="section">Nouveau cette semaine</div>';
  SESSIONS.slice(2,5).forEach(function(s){ h += itemRow(s, s.min+' min · '+s.kcal+' kcal · '+s.level); });
  return h;
}

function viewLibrary(){
  var h = head('Séances', SESSIONS.length+' vidéos disponibles');
  h += '<div class="search">'+ic('search',16,T.t500)+
       '<input id="q" value="'+S.q.replace(/"/g,'&quot;')+'" placeholder="Chercher une séance"></div>';
  h += '<div class="chips">';
  CATS.forEach(function(c){ h += '<button class="chip'+(c===S.cat?' on':'')+'" data-act="cat" data-cat="'+c+'" data-stay="1">'+c+'</button>'; });
  h += '</div>';

  var res = SESSIONS.filter(function(s){
    return (S.cat==='Tous'||s.cat===S.cat) && (S.q.trim()===''||s.title.toLowerCase().indexOf(S.q.toLowerCase())>-1);
  });
  if(!res.length){
    h += '<div class="card" style="text-align:center"><div class="card-title">Aucune séance ici</div>'+
         '<p class="tiny" style="margin-top:6px">Essaie un autre mot-clé ou reviens à la catégorie Tous.</p></div>';
  }
  res.forEach(function(s){
    h += itemRow(s, s.min+' min · '+s.kcal+' kcal', '<div class="item-meta">'+s.level+'</div>');
  });
  return h;
}

function viewPlayer(){
  var c=cur(), pct=Math.min(100, S.elapsed/(c.min*60)*100);
  var h = '<div class="head"><button class="back" data-act="tab" data-tab="library">'+ic('arrow',18,T.t900)+'</button>'+
    '<div style="font-size:13px;font-weight:600">'+c.cat+'</div>'+
    '<div class="head-right">'+themeBtn()+'</div></div>';

  h += '<div class="video" style="background:'+T.thumb[c.cat]+'"><div class="video-shade"></div>'+
    '<button class="play" data-act="toggle">'+(S.running?pause(24,T.t900):play(24,T.t900))+'</button>'+
    '<div class="clock"><span class="live'+(S.running?' on':'')+'"></span>'+ic('timer',14,T.acc2)+
    '<b>'+fmt(S.elapsed)+'</b></div></div>';

  h += '<h2 style="font-size:19px;font-weight:600;margin-top:18px;letter-spacing:-.2px">'+c.title+'</h2>'+
    '<p style="font-size:13px;color:rgba('+T.sh+',.6);margin-top:6px;line-height:1.55">'+c.blurb+'</p>'+
    '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
    '<p class="tiny" style="margin-top:7px">'+fmt(S.elapsed)+' comptabilisées sur '+c.min+' min</p>';

  if(S.autoPaused){
    h += '<div class="alert">Compteur en pause : l’app est passée en arrière-plan. Reprends quand tu es prêt.</div>';
  }

  h += '<div class="stats">'+
    '<div class="stat"><div class="tiny">Durée</div><div class="stat-val">'+c.min+' min</div></div>'+
    '<div class="stat"><div class="tiny">Calories</div><div class="stat-val">'+c.kcal+'</div></div>'+
    '<div class="stat"><div class="tiny">Niveau</div><div class="stat-val" style="font-size:14px">'+c.level+'</div></div></div>';

  h += '<div class="section">Déroulé</div><div class="card">';
  c.steps.forEach(function(st,i){
    h += '<div class="step"><div class="step-n">'+(i+1)+'</div>'+
      '<div style="flex:1;font-size:13.5px;font-weight:500">'+st[0]+'</div><div class="tiny">'+st[1]+'</div></div>';
  });
  h += '</div>';

  h += '<button class="cta'+(S.running?' pause':'')+'" data-act="toggle">'+
    (S.running?pause(17,'#fff'):play(17,'#fff'))+
    (S.running?'Mettre en pause':(S.elapsed>0?'Reprendre la séance':'Démarrer la séance'))+'</button>'+
    '<p class="note">Le temps ne se compte que pendant la lecture. Il s’arrête si tu quittes l’app.</p>';
  return h;
}

function viewStats(){
  var tm=todayMin(), w=week(), total=0; for(var i=0;i<7;i++) total+=w[i];
  var h = head('Progrès','Semaine du 7 au 13 septembre');

  h += '<div class="card"><div class="card-title" style="margin-bottom:14px">Anneaux d’activité</div><div class="today">'+
    '<div class="rings">'+ring(122,12,tm/GOAL,T.t500)+ring(92,12,S.done/2,T.acc1)+ring(62,12,5/7,T.acc2)+'</div>'+
    '<div class="legend">'+
      '<div class="legend-row"><span class="dot" style="background:'+T.t500+'"></span>Mouvement<span class="legend-val">'+tm+'/'+GOAL+' min</span></div>'+
      '<div class="legend-row"><span class="dot" style="background:'+T.acc1+'"></span>Séances<span class="legend-val">'+S.done+'/2</span></div>'+
      '<div class="legend-row"><span class="dot" style="background:'+T.acc2+'"></span>Régularité<span class="legend-val">5/7 j</span></div>'+
    '</div></div></div>';

  h += '<div class="card"><div class="card-title">Temps par jour</div>'+bars()+'</div>';

  h += '<div class="stats">'+
    '<div class="stat">'+ic('timer',16,T.t500)+'<div class="tiny" style="margin-top:6px">Cette semaine</div><div class="stat-val">'+total+' min</div></div>'+
    '<div class="stat">'+ic('flame',16,T.acc2)+'<div class="tiny" style="margin-top:6px">Série</div><div class="stat-val">5 jours</div></div></div>';

  h += '<div class="section">Dernières séances</div>';
  SESSIONS.slice(0,3).forEach(function(s){ h += itemRow(s, s.min+' min · '+s.kcal+' kcal'); });
  return h;
}

function viewProfile(){
  var tm=todayMin();
  var h = head('Profil','Abonnement actif jusqu’au 4 octobre');

  h += '<div class="card"><div class="card-title">Thème</div>'+
       '<p class="tiny" style="margin-top:4px">Deux ambiances, le contenu ne bouge pas.</p><div class="theme-list">';
  THEME_KEYS.forEach(function(k){
    var th = THEMES[k];
    h += '<button class="theme-opt'+(k===S.theme?' on':'')+'" data-act="theme" data-theme="'+k+'">'+
      '<span class="sw" style="background:linear-gradient(135deg,'+th.t500+' 0%,'+th.t900+' 50%,'+th.acc2+' 100%)"></span>'+
      '<span class="st">'+th.name+'</span>'+(k===S.theme?'<span class="ck">Actif</span>':'')+'</button>';
  });
  h += '</div></div>';

  h += '<div class="card"><div class="card-title">Objectif quotidien</div>'+
    '<p class="tiny" style="margin-top:4px">'+GOAL+' minutes de pratique par jour</p>'+
    '<div class="track"><div class="fill" style="width:'+Math.min(100,tm/GOAL*100)+'%"></div></div>'+
    '<p class="tiny" style="margin-top:8px">'+fmt(S.todaySec)+' comptabilisées aujourd’hui</p></div>';

  h += '<div class="card"><div class="card-title">Suivi du temps</div>'+
    '<p class="tiny" style="margin-top:6px;line-height:1.6">Le chronomètre démarre avec la vidéo et s’arrête dès que tu la mets en pause ou que tu quittes l’app. Les minutes alimentent tes anneaux et ta série.</p></div>';

  h += '<div class="stats">'+
    '<div class="stat"><div class="tiny">Total pratiqué</div><div class="stat-val">14 h 20</div></div>'+
    '<div class="stat"><div class="tiny">Séances suivies</div><div class="stat-val">38</div></div></div>';
  return h;
}

/* ---------- rendu ---------- */
var screenEl = document.getElementById('screen');
var miniEl = document.getElementById('mini');
var navEl = document.getElementById('nav');

function render(){
  var focused = document.activeElement && document.activeElement.id === 'q';
  var pos = focused ? document.activeElement.selectionStart : 0;

  var v = S.tab==='home' ? viewHome()
        : S.tab==='library' ? viewLibrary()
        : S.tab==='player' ? viewPlayer()
        : S.tab==='stats' ? viewStats() : viewProfile();
  screenEl.innerHTML = v;

  if(focused){
    var q = document.getElementById('q');
    if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(e){} }
  }

  miniEl.innerHTML = (S.running && S.tab!=='player')
    ? '<div class="mini">'+ic('timer',16,T.acc2)+'<div class="mini-t">'+cur().title+'</div>'+
      '<div class="mini-c">'+fmt(S.elapsed)+'</div>'+
      '<button data-act="tab" data-tab="player">'+ic('chevron',16,'#fff')+'</button></div>'
    : '';

  var tabs = [['home','home'],['library','activity'],['stats','chart'],['profile','user']];
  navEl.innerHTML = tabs.map(function(t){
    var on = S.tab===t[0] || (t[0]==='library' && S.tab==='player');
    return '<button class="'+(on?'on':'')+'" data-act="tab" data-tab="'+t[0]+'" aria-label="'+t[0]+'">'+
      ic(t[1],21,on?T.acc2:'#FFFFFF')+'</button>';
  }).join('');
}

/* ---------- interactions ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act==='tab'){ S.tab = el.getAttribute('data-tab'); }
  else if(act==='open'){
    var id = el.getAttribute('data-id');
    if(id !== S.id){ S.id = id; S.elapsed = 0; S.running = false; }
    S.tab = 'player';
  }
  else if(act==='cat'){
    S.cat = el.getAttribute('data-cat');
    if(!el.getAttribute('data-stay')) S.tab = 'library';
  }
  else if(act==='toggle'){ S.autoPaused = false; S.running = !S.running; }
  else if(act==='theme'){ applyTheme(el.getAttribute('data-theme')); }
  render();
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id==='q'){ S.q = e.target.value; render(); }
});

/* compteur : n’avance que si une vidéo tourne et que l’app est au premier plan */
setInterval(function(){
  if(!S.running) return;
  S.elapsed++; S.todaySec++;
  var c = cur();
  if(S.elapsed >= c.min*60){ S.running = false; S.done++; }
  render();
}, 1000);

document.addEventListener('visibilitychange', function(){
  if(document.hidden && S.running){ S.running = false; S.autoPaused = true; render(); }
});

applyTheme('lagon');
render();
</script>
</body>
</html>
